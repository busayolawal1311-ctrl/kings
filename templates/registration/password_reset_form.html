{% extends 'shared/mainlayout.html' %}

<!-- ==========================================================
   Password Reset Request Page
   Allows users to request a secure password reset
   by entering their registered email address.
========================================================== -->

{% block title %}
    Reset Password
{% endblock %}


{% block content %}

    <!-- ======================================================
       Password Reset Request Form
    ======================================================= -->
    <section class="shell section review-form">

        <h1>
            Reset Your Password
        </h1>

        <p>
            Enter the email address associated with your account,
            and we'll send you a secure link to reset your password.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                class="button"
                type="submit"
            >
                Send Reset Link
            </button>

        </form>

    </section>

{% endblock %}
