{% extends 'shared/mainlayout.html' %}

<!-- ==========================================================
   Password Reset Confirmation Page
   Allows users to create a new password after
   verifying their password reset link.
========================================================== -->

{% block title %}
    Choose a New Password
{% endblock %}


{% block content %}

    <!-- ======================================================
       Password Reset Form
    ======================================================= -->
    <section class="shell section review-form">

        <h1>
            Choose a New Password
        </h1>

        <p>
            Enter a strong new password below to regain access to your account.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                class="button"
                type="submit"
            >
                Save Password
            </button>

        </form>

    </section>

{% endblock %}
