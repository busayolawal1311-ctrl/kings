{% extends 'shared/mainlayout.html' %}

<!-- ==========================================================
   Password Change Success Page
   Displayed after a user successfully updates
   their account password.
========================================================== -->

{% block title %}
    Password Updated
{% endblock %}


{% block content %}

    <!-- ======================================================
       Success Message
    ======================================================= -->
    <section class="shell section empty-state">

        <h1>
            Password Updated
        </h1>

        <p>
            Your password has been updated successfully.
            You can now sign in using your new password.
        </p>

        <a
            class="button"
            href="{% url 'login' %}"
        >
            Sign In
        </a>

    </section>

{% endblock %}
