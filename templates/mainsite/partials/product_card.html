<div class="group">
    <a href="{% url 'mainsite:product_detail' product.slug %}" class="block">
        <div class="relative bg-[#F0EEED] rounded-3xl p-6 overflow-hidden">
            {% if product.badge %}
                <span class="absolute top-4 left-4 bg-red-500 text-white text-xs px-3 py-1 rounded-full">
                    {{ product.badge }}
                </span>
            {% elif product.is_new_arrival %}
                <span class="absolute top-4 left-4 bg-red-500 text-white text-xs px-3 py-1 rounded-full">
                    NEW
                </span>
            {% elif product.is_top_selling %}
                <span class="absolute top-4 left-4 bg-green-600 text-white text-xs px-3 py-1 rounded-full">
                    BEST SELLER
                </span>
            {% endif %}

            <button type="button" class="absolute top-4 right-4 w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center transition hover:scale-110" aria-label="Add {{ product.name }} to wishlist">
                &#9825;
            </button>

            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                class="w-full h-72 object-contain transition duration-500 group-hover:scale-110"
            >
        </div>
    </a>

    <div class="pt-4">
        <h3 class="font-bold text-lg">
            <a href="{% url 'mainsite:product_detail' product.slug %}">
                {{ product.name }}
            </a>
        </h3>

        <div class="flex items-center gap-2 mt-2">
            <span class="text-yellow-500">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
            <span class="text-sm text-gray-500">({{ product.review_count }})</span>
        </div>

        <div class="flex items-center gap-3 mt-3">
            <span class="font-bold text-2xl">&#8358;{{ product.price }}</span>
            {% if product.old_price %}
                <span class="text-gray-400 line-through">&#8358;{{ product.old_price }}</span>
            {% endif %}
        </div>

        <button class="w-full mt-4 py-3 rounded-full bg-black text-white font-medium transition hover:bg-neutral-800">
            Add to Cart
        </button>
    </div>
</div>
